name: 🧠 The Architect
on:
  push: { branches: [main], paths: ['next-prompt.md'] }
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ${{ github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","proxmox-actions"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - run: bun install
      - name: Dispatch
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat next-prompt.md)
          bun run scripts/dispatch-jules.ts "$PROMPT"